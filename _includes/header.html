<header class="site-header">
  <div class="container">
    <div class="header-content">
      <!-- Logo -->
      <a href="{{ site.baseurl }}/" class="logo">
        <img src="/assets/img/logo.png" alt="{{ site.title }}" style="width: 130px; ">
      </a>

      <!-- Navigation -->
      <nav class="main-nav">
        {% for item in site.data.navigation %}
          <a href="{{ item.url | relative_url }}" 
             class="nav-link {% if page.url == item.url %}active{% endif %}">
            {{ item.title }}
          </a>
        {% endfor %}
      </nav>
    </div>
  </div>
</header>

<style>
.site-header {
  padding: 1rem 0;
  background-color: #ffffff;
  position: relative;
  height: 100px;
  width: 1200px;
  margin: 0 auto;
}

.header-content {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 auto;
  /* padding: 0 2rem; */
  width: 1200px;
  position: relative;
  height: 100%;
}

.logo {
  position: relative;
  transform: translateY(0);
  z-index: 10;
  display: flex;
  align-items: center;
}

.logo-icon {
  margin-right: 0.5rem;
  transform: rotate(45deg);
}

.main-nav {
  display: flex;
  gap: 2rem;
  align-items: center;
  transform: translateY(0);
}

.nav-link {
  text-decoration: none;
  color: #333333;
  font-size: 1rem;
  transition: color 0.2s;
}

.nav-link:hover {
  color: #1756e8;
}

.nav-link.active {
  color: #1756e8;
  border-bottom: 2px solid #1756e8;
}
</style>
